<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de Sesión</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="contenedor-inicio">

    <h2>Ingresar</h2>

    <form action="#" method="post">
      <div class="grupo-formulario">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com" />
      </div>

      <div class="grupo-formulario">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required placeholder="Tu contraseña" />
      </div>

      <button type="submit" class="boton-inicio">Entrar</button>

    </form>

    <div class="pie-formulario">
      <p>¿No tienes cuenta? <a href="/registro/index.html">Regístrate</a></p>
    </div>

    <div class="recuperar"> <a href="/recuperar/index.html">Recuperar contraseña</a> </div>
 
  </div>

</body>
</html>
