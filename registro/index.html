<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="contenedor-registro">

    <h2> Crear cuenta</h2>

    <form action="#" method="post">

      <div class="grupo-formulario">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo" />
      </div>

      <div class="grupo-formulario">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com" />
      </div>

      <div class="grupo-formulario">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required placeholder="Crea una contraseña" />
      </div>

      <div class="grupo-formulario">
        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" name="confirmar" required placeholder="confirma contraseña" />
      </div>

      <button type="submit" class="boton-registro">Crear</button>

    </form>

    <div class="pie-formulario">
      <p>¿Ya tienes cuenta? <a href="/inicio_sesion/index.html">Inicia sesion</a></p>
    </div>
  </div>

</body>
</html>
